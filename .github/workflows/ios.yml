# iOS has to be built on a Mac. This runs on GitHub's macOS machines:
#  - every push: compiles the app + keyboard for the simulator (no Apple account needed) to catch errors;
#  - manual run with "testflight" ticked: signs with your Apple account and uploads to TestFlight, so you install it
#    on your iPhone from the TestFlight app. Needs these repository secrets (App Store Connect > Users and Access >
#    Integrations > Keys, role Admin): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's contents), APPLE_TEAM_ID.
name: ios
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign and upload to TestFlight
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - name: Compile for the simulator
        run: |
          xcodebuild -project WisperKeys.xcodeproj -scheme WisperKeys -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify || exit ${PIPESTATUS[0]}
      - name: Archive and upload to TestFlight
        if: ${{ inputs.testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/key.p8"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/key.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project WisperKeys.xcodeproj -scheme WisperKeys -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/wk.xcarchive" \
            DEVELOPMENT_TEAM=$TEAM CURRENT_PROJECT_VERSION=${{ github.run_number }} $AUTH archive
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/wk.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" $AUTH
